name: codex
description: OpenAI Codex CLI — AI-powered coding agent
docs_url: https://github.com/openai/codex
agents:
  - codex
settings:
  - name: codex-version
    description: Codex CLI release installed in the Lab; latest keeps the installed release, an exact release is installed and protected from self-updates.
    default: latest
    examples:
      - "0.160.0"
      - latest
    phases:
      - install
      - start
  - name: model
    description: Codex model name passed to the Codex CLI and resolved by LiteLLM.
    default: gpt-6.1-sol
    examples:
      - gpt-6.1-sol
      - gpt-6-astra
      - gpt-6-luna
    phases:
      - start
