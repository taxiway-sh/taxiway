name: claude-code
description: Anthropic Claude Code CLI — AI-powered coding assistant
docs_url: https://docs.anthropic.com/en/docs/claude-code
agents:
  - claude-code
settings:
  - name: claude-code-version
    description: Claude Code CLI release installed in the Lab; latest keeps the installed release, an exact release is installed and protected from self-updates.
    default: latest
    examples:
      - "2.1.288"
      - latest
    phases:
      - install
      - start
  - name: model
    description: Full Claude Code model name passed with --model and resolved by LiteLLM.
    default: claude-opus-5-5
    examples:
      - claude-fable-5-1
      - claude-opus-5-5
      - claude-sonnet-5-5
    phases:
      - start
  - name: tool-search
    description: Load MCP tool definitions on demand. Use false to disable tool search or auto:N for a context percentage threshold.
    default: "true"
    examples:
      - "true"
      - "false"
      - "auto:5"
    phases:
      - start
  - name: claudeai-mcp-servers
    description: Import connected Claude.ai MCP servers. Disabled by default; set true to opt in.
    default: "false"
    examples:
      - "false"
      - "true"
    phases:
      - start
