name: gastown
description: Gas Town HQ + workspace shell
docs_url: https://gastownhall.ai
agents:
  - claude-code
settings:
  - name: version
    description: Gastown release version/tag to install
    default: latest
    examples:
      - "1.2.1"
      - latest
    phases:
      - install
  - name: beads-version
    description: Beads version/tag override; omitted uses the Gastown compatibility matrix
    examples:
      - "1.0.4"
      - latest
    phases:
      - install
  - name: model
    description: Full Claude Code model name passed with --model and resolved by LiteLLM.
    default: claude-opus-5-5
    examples:
      - claude-fable-5-1
      - claude-opus-5-5
      - claude-sonnet-5-5
    phases:
      - start
  - name: tool-search
    description: Load MCP tool definitions on demand. Use false to disable tool search or auto:N for a context percentage threshold.
    default: "true"
    examples:
      - "true"
      - "false"
      - "auto:5"
    phases:
      - start
  - name: claudeai-mcp-servers
    description: Import connected Claude.ai MCP servers. Disabled by default; set true to opt in.
    default: "false"
    examples:
      - "false"
      - "true"
    phases:
      - start
