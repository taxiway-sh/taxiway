name: Install integration

on:
  push:
    paths:
      - .github/workflows/install.yml
  workflow_dispatch:
    inputs:
      release:
        description: Taxiway release to install (latest or a tag such as v0.1.0)
        required: true
        default: latest
        type: string

permissions:
  contents: read
  attestations: read

env:
  LIMA_VERSION: v2.1.1
  TAXIWAY_RELEASE: ${{ inputs.release || 'latest' }}

jobs:
  linux:
    name: Linux / ${{ matrix.driver }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        driver: [docker, lima]

    steps:
      - name: Install prerequisites
        shell: bash
        env:
          DRIVER: ${{ matrix.driver }}
        run: |
          set -euxo pipefail
          sudo systemctl start docker
          docker info
          docker compose version

          case "$DRIVER" in
            docker)
              :
              ;;
            lima)
              sudo apt-get update
              sudo apt-get install -y qemu-system-x86 qemu-utils
              sudo modprobe kvm
              sudo chown "$(whoami)" /dev/kvm

              version="${LIMA_VERSION#v}"
              archive="lima-${version}-Linux-x86_64.tar.gz"
              base_url="https://github.com/lima-vm/lima/releases/download/${LIMA_VERSION}"
              workdir="$(mktemp -d)"
              trap 'rm -rf "$workdir"' EXIT

              curl -fsSL "$base_url/$archive" -o "$workdir/$archive"
              curl -fsSL "$base_url/SHA256SUMS" -o "$workdir/SHA256SUMS"
              expected="$(grep " $archive\$" "$workdir/SHA256SUMS" | awk '{print $1}')"
              actual="$(sha256sum "$workdir/$archive" | awk '{print $1}')"
              test -n "$expected"
              test "$actual" = "$expected"
              sudo tar -C /usr/local -xzf "$workdir/$archive"
              limactl --version
              ;;
            *)
              printf 'unsupported driver: %s\n' "$DRIVER" >&2
              exit 1
              ;;
          esac

      - name: Install Taxiway
        shell: bash
        run: |
          set -euxo pipefail
          case "$TAXIWAY_RELEASE" in
            latest)
              install_url="https://github.com/taxiway-sh/taxiway/releases/latest/download/install.sh"
              ;;
            v[0-9]*)
              install_url="https://github.com/taxiway-sh/taxiway/releases/download/${TAXIWAY_RELEASE}/install.sh"
              ;;
            *)
              printf 'invalid Taxiway release: %s\n' "$TAXIWAY_RELEASE" >&2
              exit 1
              ;;
          esac

          curl -fsSL "$install_url" | sh
          test -x "$HOME/.local/bin/taxiway"
          test -d "$HOME/.taxiway/runtime/infra"
          test -d "$HOME/.taxiway/runtime/agents"
          test -d "$HOME/.taxiway/runtime/orchestrators"
          "$HOME/.local/bin/taxiway" version
          "$HOME/.local/bin/taxiway" init

      - name: Verify installation
        shell: bash
        timeout-minutes: 10
        env:
          DRIVER: ${{ matrix.driver }}
          LAB: install-linux-x64-${{ matrix.driver }}
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          status_file="$(mktemp)"
          trap 'rm -f "$status_file"' EXIT

          section_has_status() {
            local section="$1"
            local expected="$2"
            awk -v section="$section" -v expected="$expected" '
              $0 == section ":" { active = 1; next }
              active && /^[^ ]/ { active = 0 }
              active && $0 == "  Status: " expected { found = 1 }
              END { exit(found ? 0 : 1) }
            '
          }

          runtime_is_ready() {
            taxiway status >"$status_file" &&
              grep -Fq '  docker: available' "$status_file" &&
              section_has_status Proxy running <"$status_file" &&
              section_has_status 'Langfuse stack' running <"$status_file"
          }

          deadline=$((SECONDS + 120))
          until runtime_is_ready; do
            if (( SECONDS >= deadline )); then
              printf 'Taxiway runtime did not become ready within 120 seconds.\n' >&2
              sed -n '1,240p' "$status_file" >&2
              exit 1
            fi
            sleep 5
          done
          sed -n '1,240p' "$status_file"
          docker info
          docker compose version

          taxiway create "$LAB" --type codex --driver "$DRIVER"
          taxiway list "$LAB" | tee /tmp/taxiway-list.txt
          awk -v lab="$LAB" -v driver="$DRIVER" '
            $1 == lab && $2 == "codex" && $3 == "degraded" &&
              $4 == "created" && $5 == driver { found = 1 }
            END { exit(found ? 0 : 1) }
          ' /tmp/taxiway-list.txt

          case "$DRIVER" in
            docker)
              test "$(docker inspect --format '{{.State.Status}}' "taxiway-$LAB")" = running
              ;;
            lima)
              limactl list --format='{{.Name}} {{.Status}}' |
                grep -Fx "taxiway-$LAB Running"
              ;;
          esac

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        env:
          DRIVER: ${{ matrix.driver }}
          LAB: install-linux-x64-${{ matrix.driver }}
        run: |
          set +e
          export PATH="$HOME/.local/bin:$PATH"
          taxiway status
          docker version
          docker compose version
          docker info
          docker ps -a
          if [ "$DRIVER" = lima ]; then
            limactl --debug list --format='{{.Name}} {{.Status}}'
            for log in "$HOME/.lima/taxiway-$LAB"/*.log; do
              test -f "$log" || continue
              printf '\n===== %s =====\n' "$log"
              tail -n 200 "$log"
            done

            rendered_yaml="$HOME/.taxiway/lab-state/$LAB/agent-lab.yaml"
            if [ -f "$rendered_yaml" ]; then
              printf '\n===== %s =====\n' "$rendered_yaml"
              sed -n '1,260p' "$rendered_yaml"
            fi
          fi
          df -h

      - name: Clean up
        if: always()
        shell: bash
        timeout-minutes: 5
        env:
          DRIVER: ${{ matrix.driver }}
          LAB: install-linux-x64-${{ matrix.driver }}
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          if [ -f "$HOME/.taxiway/lab-state/$LAB/ref.json" ]; then
            taxiway rm "$LAB" --yes
          fi

          if command -v taxiway >/dev/null 2>&1; then
            taxiway list "$LAB" | tee /tmp/taxiway-list-after-rm.txt
            if grep -Eq "^${LAB}[[:space:]]" /tmp/taxiway-list-after-rm.txt; then
              printf 'Lab %s is still present in Taxiway state.\n' "$LAB" >&2
              exit 1
            fi
            test ! -e "$HOME/.taxiway/lab-state/$LAB"
          fi

          case "$DRIVER" in
            docker)
              if docker info >/dev/null 2>&1; then
                test -z "$(docker ps -aq --filter "name=^/taxiway-$LAB$")"
              fi
              ;;
            lima)
              if command -v limactl >/dev/null 2>&1; then
                if limactl list --format='{{.Name}}' | grep -Fxq "taxiway-$LAB"; then
                  printf 'Lima instance taxiway-%s still exists.\n' "$LAB" >&2
                  exit 1
                fi
              fi
              ;;
          esac

          if command -v taxiway >/dev/null 2>&1; then
            taxiway destroy --yes || true
          fi

  macos:
    name: macOS / ${{ matrix.driver }}
    runs-on: macos-15-intel
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        driver: [docker, lima]

    steps:
      - name: Install prerequisites
        shell: bash
        env:
          DRIVER: ${{ matrix.driver }}
        run: |
          set -euxo pipefail
          brew install colima docker docker-compose
          colima start --cpu 2 --memory 4 --disk 20
          docker info
          docker compose version

          case "$DRIVER" in
            docker)
              :
              ;;
            lima)
              limactl --version
              ;;
            *)
              printf 'unsupported driver: %s\n' "$DRIVER" >&2
              exit 1
              ;;
          esac

      - name: Install Taxiway
        shell: bash
        run: |
          set -euxo pipefail
          case "$TAXIWAY_RELEASE" in
            latest)
              install_url="https://github.com/taxiway-sh/taxiway/releases/latest/download/install.sh"
              ;;
            v[0-9]*)
              install_url="https://github.com/taxiway-sh/taxiway/releases/download/${TAXIWAY_RELEASE}/install.sh"
              ;;
            *)
              printf 'invalid Taxiway release: %s\n' "$TAXIWAY_RELEASE" >&2
              exit 1
              ;;
          esac

          curl -fsSL "$install_url" | sh
          test -x "$HOME/.local/bin/taxiway"
          test -d "$HOME/.taxiway/runtime/infra"
          test -d "$HOME/.taxiway/runtime/agents"
          test -d "$HOME/.taxiway/runtime/orchestrators"
          "$HOME/.local/bin/taxiway" version
          "$HOME/.local/bin/taxiway" init

      - name: Verify installation
        shell: bash
        timeout-minutes: 10
        env:
          DRIVER: ${{ matrix.driver }}
          LAB: install-macos-intel-${{ matrix.driver }}
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          status_file="$(mktemp)"
          trap 'rm -f "$status_file"' EXIT

          section_has_status() {
            local section="$1"
            local expected="$2"
            awk -v section="$section" -v expected="$expected" '
              $0 == section ":" { active = 1; next }
              active && /^[^ ]/ { active = 0 }
              active && $0 == "  Status: " expected { found = 1 }
              END { exit(found ? 0 : 1) }
            '
          }

          runtime_is_ready() {
            taxiway status >"$status_file" &&
              grep -Fq '  docker: available' "$status_file" &&
              section_has_status Proxy running <"$status_file" &&
              section_has_status 'Langfuse stack' running <"$status_file"
          }

          deadline=$((SECONDS + 120))
          until runtime_is_ready; do
            if (( SECONDS >= deadline )); then
              printf 'Taxiway runtime did not become ready within 120 seconds.\n' >&2
              sed -n '1,240p' "$status_file" >&2
              exit 1
            fi
            sleep 5
          done
          sed -n '1,240p' "$status_file"
          docker info
          docker compose version

          taxiway create "$LAB" --type codex --driver "$DRIVER"
          taxiway list "$LAB" | tee /tmp/taxiway-list.txt
          awk -v lab="$LAB" -v driver="$DRIVER" '
            $1 == lab && $2 == "codex" && $3 == "degraded" &&
              $4 == "created" && $5 == driver { found = 1 }
            END { exit(found ? 0 : 1) }
          ' /tmp/taxiway-list.txt

          case "$DRIVER" in
            docker)
              test "$(docker inspect --format '{{.State.Status}}' "taxiway-$LAB")" = running
              ;;
            lima)
              limactl list --format='{{.Name}} {{.Status}}' |
                grep -Fx "taxiway-$LAB Running"
              ;;
          esac

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        env:
          DRIVER: ${{ matrix.driver }}
          LAB: install-macos-intel-${{ matrix.driver }}
        run: |
          set +e
          export PATH="$HOME/.local/bin:$PATH"
          taxiway status
          docker version
          docker compose version
          docker info
          docker ps -a
          if [ "$DRIVER" = lima ]; then
            limactl --debug list --format='{{.Name}} {{.Status}}'
            for log in "$HOME/.lima/taxiway-$LAB"/*.log; do
              test -f "$log" || continue
              printf '\n===== %s =====\n' "$log"
              tail -n 200 "$log"
            done

            rendered_yaml="$HOME/.taxiway/lab-state/$LAB/agent-lab.yaml"
            if [ -f "$rendered_yaml" ]; then
              printf '\n===== %s =====\n' "$rendered_yaml"
              sed -n '1,260p' "$rendered_yaml"
            fi
          fi
          df -h
          sysctl -n hw.ncpu hw.memsize

      - name: Clean up
        if: always()
        shell: bash
        timeout-minutes: 5
        env:
          DRIVER: ${{ matrix.driver }}
          LAB: install-macos-intel-${{ matrix.driver }}
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          if [ -f "$HOME/.taxiway/lab-state/$LAB/ref.json" ]; then
            taxiway rm "$LAB" --yes
          fi

          if command -v taxiway >/dev/null 2>&1; then
