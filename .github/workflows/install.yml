name: Install integration

on:
  push:
    paths:
      - .github/workflows/install.yml
  workflow_dispatch:
    inputs:
      release:
        description: Taxiway release to install (latest or a tag such as v0.1.0)
        required: true
        default: latest
        type: string

permissions:
  contents: read
  attestations: read

env:
  LIMA_VERSION: v2.1.1
  TAXIWAY_RELEASE: ${{ inputs.release || 'latest' }}

jobs:
  linux:
    name: Linux / ${{ matrix.driver }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        driver: [docker, lima]

    steps:
      - name: Start Docker on Linux
        if: matrix.driver == 'docker'
        shell: bash
        run: |
          set -euxo pipefail
          sudo systemctl start docker
          docker info

      - name: Install Lima
        if: matrix.driver == 'lima'
        uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
        with:
          version: ${{ env.LIMA_VERSION }}

      - name: Install Taxiway
        shell: bash
        run: |
          set -euxo pipefail
          case "$TAXIWAY_RELEASE" in
            latest)
              install_url="https://github.com/taxiway-sh/taxiway/releases/latest/download/install.sh"
              ;;
            v[0-9]*)
              install_url="https://github.com/taxiway-sh/taxiway/releases/download/${TAXIWAY_RELEASE}/install.sh"
              ;;
            *)
              printf 'invalid Taxiway release: %s\n' "$TAXIWAY_RELEASE" >&2
              exit 1
              ;;
          esac

          curl -fsSL "$install_url" | sh
          test -x "$HOME/.local/bin/taxiway"
          test -d "$HOME/.taxiway/runtime/infra"
          test -d "$HOME/.taxiway/runtime/agents"
          test -d "$HOME/.taxiway/runtime/orchestrators"
          "$HOME/.local/bin/taxiway" version

      - name: Exercise the ${{ matrix.driver }} driver
        shell: bash
        timeout-minutes: 10
        env:
          DRIVER: ${{ matrix.driver }}
          LAB: install-linux-x64-${{ matrix.driver }}
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          taxiway create "$LAB" --type codex --driver "$DRIVER"
          taxiway list "$LAB" | tee /tmp/taxiway-list.txt
          grep -F "$LAB" /tmp/taxiway-list.txt

      - name: Collect driver diagnostics
        if: failure()
        shell: bash
        env:
          DRIVER: ${{ matrix.driver }}
          LAB: install-linux-x64-${{ matrix.driver }}
        run: |
          set +e
          if [ "$DRIVER" = lima ]; then
            limactl list --format='{{.Name}} {{.Status}}'
            for log in "$HOME/.lima/taxiway-$LAB"/*.log; do
              test -f "$log" || continue
              printf '\n===== %s =====\n' "$log"
              tail -n 200 "$log"
            done
          else
            docker info
            docker ps -a
          fi
          df -h

      - name: Clean up the ${{ matrix.driver }} environment
        if: always()
        shell: bash
        timeout-minutes: 5
        env:
          LAB: install-linux-x64-${{ matrix.driver }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          taxiway rm "$LAB" --yes || true

  macos:
    name: macOS / ${{ matrix.driver }}
    runs-on: macos-15-intel
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        driver: [docker, lima]

    steps:
      - name: Install ${{ matrix.driver }} prerequisites
        shell: bash
        env:
          DRIVER: ${{ matrix.driver }}
        run: |
          set -euxo pipefail
          case "$DRIVER" in
            docker)
              brew install colima docker
              colima start --cpu 2 --memory 4 --disk 20
              docker info
              ;;
            lima)
              brew install lima
              limactl --version
              ;;
            *)
              printf 'unsupported driver: %s\n' "$DRIVER" >&2
              exit 1
              ;;
          esac

      - name: Install Taxiway
        shell: bash
        run: |
          set -euxo pipefail
          case "$TAXIWAY_RELEASE" in
            latest)
              install_url="https://github.com/taxiway-sh/taxiway/releases/latest/download/install.sh"
              ;;
            v[0-9]*)
              install_url="https://github.com/taxiway-sh/taxiway/releases/download/${TAXIWAY_RELEASE}/install.sh"
              ;;
            *)
              printf 'invalid Taxiway release: %s\n' "$TAXIWAY_RELEASE" >&2
              exit 1
              ;;
          esac

          curl -fsSL "$install_url" | sh
          test -x "$HOME/.local/bin/taxiway"
          test -d "$HOME/.taxiway/runtime/infra"
          test -d "$HOME/.taxiway/runtime/agents"
          test -d "$HOME/.taxiway/runtime/orchestrators"
          "$HOME/.local/bin/taxiway" version

      - name: Exercise the ${{ matrix.driver }} driver
        shell: bash
        timeout-minutes: 10
        env:
          DRIVER: ${{ matrix.driver }}
          LAB: install-macos-intel-${{ matrix.driver }}
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          taxiway create "$LAB" --type codex --driver "$DRIVER"
          taxiway list "$LAB" | tee /tmp/taxiway-list.txt
          grep -F "$LAB" /tmp/taxiway-list.txt

      - name: Collect driver diagnostics
        if: failure()
        shell: bash
        env:
          DRIVER: ${{ matrix.driver }}
          LAB: install-macos-intel-${{ matrix.driver }}
        run: |
          set +e
          if [ "$DRIVER" = lima ]; then
            limactl list --format='{{.Name}} {{.Status}}'
            for log in "$HOME/.lima/taxiway-$LAB"/*.log; do
              test -f "$log" || continue
              printf '\n===== %s =====\n' "$log"
              tail -n 200 "$log"
            done
          else
            docker info
            docker ps -a
          fi
          df -h
          sysctl -n hw.ncpu hw.memsize

      - name: Clean up the ${{ matrix.driver }} environment
        if: always()
        shell: bash
        timeout-minutes: 5
        env:
          DRIVER: ${{ matrix.driver }}
          LAB: install-macos-intel-${{ matrix.driver }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          taxiway rm "$LAB" --yes || true
          if [ "$DRIVER" = docker ]; then
            colima delete --force || true
          fi

  windows:
    name: Windows WSL2 / ${{ matrix.driver }}
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        driver: [docker, lima]

    steps:
      - name: Configure WSL2
        shell: pwsh
        run: |
          $wslConfig = @"
          [wsl2]
          memory=12GB
          processors=4
          nestedVirtualization=true
          "@
          Set-Content -Path "$env:USERPROFILE\.wslconfig" -Value $wslConfig -Encoding ascii

          wsl.exe --set-default-version 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          wsl.exe --install --distribution Ubuntu-24.04 --web-download --no-launch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          wsl.exe --status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          wsl.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          wsl.exe --list --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install prerequisites inside WSL2
        shell: pwsh
        env:
          DRIVER: ${{ matrix.driver }}
        run: |
          $script = @'
          set -euxo pipefail

          driver="$1"
          lima_version="$2"
          export DEBIAN_FRONTEND=noninteractive

          uname -a
          uname -m
          cat /proc/version

          apt-get update
          apt-get install -y ca-certificates curl jq sudo util-linux

          lscpu
          if [ -c /dev/kvm ]; then
            printf 'WSL2 nested virtualization: /dev/kvm is available\n'
            ls -l /dev/kvm
          else
            printf 'WSL2 nested virtualization: /dev/kvm is unavailable\n'
          fi

          if ! id runner >/dev/null 2>&1; then
            useradd --create-home --shell /bin/bash runner
          fi
          printf '%s\n' 'runner ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/runner
          chmod 0440 /etc/sudoers.d/runner

          cat >/etc/wsl.conf <<'EOF'
          [boot]
          systemd=true

          [user]
          default=runner
          EOF

          case "$driver" in
            docker)
              apt-get install -y docker.io
              usermod -aG docker runner
              ;;
            lima)
              apt-get install -y qemu-system-x86 qemu-utils

              version="${lima_version#v}"
              archive="lima-${version}-Linux-x86_64.tar.gz"
              base_url="https://github.com/lima-vm/lima/releases/download/${lima_version}"
              workdir="$(mktemp -d)"
              trap 'rm -rf "$workdir"' EXIT

              curl -fsSL "$base_url/$archive" -o "$workdir/$archive"
              curl -fsSL "$base_url/SHA256SUMS" -o "$workdir/SHA256SUMS"
              expected="$(grep " $archive\$" "$workdir/SHA256SUMS" | awk '{print $1}')"
              actual="$(sha256sum "$workdir/$archive" | awk '{print $1}')"
              test -n "$expected"
              test "$actual" = "$expected"
              tar -C /usr/local -xzf "$workdir/$archive"

              if [ -c /dev/kvm ]; then
                getent group kvm >/dev/null || groupadd kvm
                usermod -aG kvm runner
                chown root:kvm /dev/kvm
                chmod 0660 /dev/kvm
              fi
              ;;
            *)
              printf 'unsupported driver: %s\n' "$driver" >&2
              exit 1
              ;;
          esac
          '@

          $scriptPath = Join-Path $env:RUNNER_TEMP "taxiway-install-prerequisites.sh"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText($scriptPath, ($script -replace "`r`n", "`n"), $utf8NoBom)
          $wslScriptPath = (wsl.exe --distribution Ubuntu-24.04 --user root --exec wslpath -a $scriptPath).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          wsl.exe --distribution Ubuntu-24.04 --user root --exec bash $wslScriptPath $env:DRIVER $env:LIMA_VERSION
          $scriptExitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath
          if ($scriptExitCode -ne 0) { exit $scriptExitCode }

          wsl --terminate Ubuntu-24.04
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Taxiway inside WSL2
        shell: pwsh
        run: |
          $script = @'
          set -euxo pipefail

          taxiway_release="$1"
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

          case "$taxiway_release" in
            latest)
              install_url="https://github.com/taxiway-sh/taxiway/releases/latest/download/install.sh"
              ;;
            v[0-9]*)
              install_url="https://github.com/taxiway-sh/taxiway/releases/download/${taxiway_release}/install.sh"
              ;;
            *)
              printf 'invalid Taxiway release: %s\n' "$taxiway_release" >&2
              exit 1
              ;;
          esac

          curl -fsSL "$install_url" | sh
          test -x "$HOME/.local/bin/taxiway"
          test -d "$HOME/.taxiway/runtime/infra"
          test -d "$HOME/.taxiway/runtime/agents"
          test -d "$HOME/.taxiway/runtime/orchestrators"
          taxiway version
          '@

          $scriptPath = Join-Path $env:RUNNER_TEMP "taxiway-install.sh"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText($scriptPath, ($script -replace "`r`n", "`n"), $utf8NoBom)
          $wslScriptPath = (wsl.exe --distribution Ubuntu-24.04 --user root --exec wslpath -a $scriptPath).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          wsl.exe --distribution Ubuntu-24.04 --user runner --exec bash $wslScriptPath $env:TAXIWAY_RELEASE
          $scriptExitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath
          if ($scriptExitCode -ne 0) { exit $scriptExitCode }

      - name: Exercise the ${{ matrix.driver }} driver inside WSL2
        shell: pwsh
        timeout-minutes: 10
        env:
          DRIVER: ${{ matrix.driver }}
        run: |
          $script = @'
          set -euxo pipefail

          driver="$1"
          lab="install-windows-server-2025-wsl2-${driver}"
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

          case "$driver" in
            docker)
              sudo systemctl start docker
              timeout 30 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
              docker info
              ;;
            lima)
              limactl --version
              id
              if [ -c /dev/kvm ]; then
                printf 'Lima acceleration: /dev/kvm is available\n'
                ls -l /dev/kvm
                test -r /dev/kvm
                test -w /dev/kvm

                set +e
                timeout 2 qemu-system-x86_64 \
                  -accel kvm \
                  -machine none \
                  -nodefaults \
                  -display none \
                  -S
                qemu_status=$?
                set -e
                if [ "$qemu_status" -ne 124 ]; then
                  printf 'QEMU KVM probe failed with exit code %s\n' "$qemu_status" >&2
                  exit "$qemu_status"
                fi
                printf 'QEMU KVM probe succeeded\n'
              else
                printf 'Lima acceleration: /dev/kvm is unavailable; Lima will use QEMU TCG\n'
              fi
              ;;
            *)
              printf 'unsupported driver: %s\n' "$driver" >&2
              exit 1
              ;;
          esac

          taxiway create "$lab" --type codex --driver "$driver"
          taxiway list "$lab" | tee /tmp/taxiway-list.txt
          grep -F "$lab" /tmp/taxiway-list.txt
          '@

          $scriptPath = Join-Path $env:RUNNER_TEMP "taxiway-exercise-driver.sh"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText($scriptPath, ($script -replace "`r`n", "`n"), $utf8NoBom)
          $wslScriptPath = (wsl.exe --distribution Ubuntu-24.04 --user root --exec wslpath -a $scriptPath).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          wsl.exe --distribution Ubuntu-24.04 --user runner --exec bash $wslScriptPath $env:DRIVER
          $scriptExitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath
          if ($scriptExitCode -ne 0) { exit $scriptExitCode }

      - name: Collect driver diagnostics inside WSL2
        if: failure()
        shell: pwsh
        env:
          DRIVER: ${{ matrix.driver }}
        run: |
          $script = @'
          set +e

          driver="$1"
          lab="install-windows-server-2025-wsl2-${driver}"
          runner_home=/home/runner
          runner_path="$runner_home/.local/bin:/usr/local/bin:/usr/bin:/bin"

          if ! id runner >/dev/null 2>&1; then
            printf 'The runner user was not created; no user-level diagnostics are available.\n'
          elif [ "$driver" = lima ]; then
            sudo -u runner env \
              HOME="$runner_home" \
              PATH="$runner_path" \
              limactl --debug list --format='{{.Name}} {{.Status}}'

            instance_dir="$runner_home/.lima/taxiway-$lab"
            printf '\n===== Lima instance files: %s =====\n' "$instance_dir"
            find "$instance_dir" -maxdepth 2 -type f -print 2>/dev/null | sort

            while IFS= read -r diagnostic; do
              printf '\n===== %s =====\n' "$diagnostic"
              tail -n 250 "$diagnostic"
            done < <(
              find "$instance_dir" -maxdepth 2 -type f \
                \( -name '*.log' -o -name '*.yaml' -o -name '*.json' \) \
                -print 2>/dev/null | sort
            )

            rendered_yaml="$runner_home/.taxiway/lab-state/$lab/agent-lab.yaml"
            if [ -f "$rendered_yaml" ]; then
              printf '\n===== %s =====\n' "$rendered_yaml"
              cat "$rendered_yaml"
            fi
          else
            sudo -u runner env \
              HOME="$runner_home" \
              PATH="$runner_path" \
              docker info
            sudo -u runner env \
              HOME="$runner_home" \
              PATH="$runner_path" \
              docker ps -a
          fi
          df -h
          exit 0
          '@

          $scriptPath = Join-Path $env:RUNNER_TEMP "taxiway-driver-diagnostics.sh"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText($scriptPath, ($script -replace "`r`n", "`n"), $utf8NoBom)
          $wslScriptPath = (wsl.exe --distribution Ubuntu-24.04 --user root --exec wslpath -a $scriptPath).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          wsl.exe --distribution Ubuntu-24.04 --user root --exec bash $wslScriptPath $env:DRIVER
          Remove-Item -Force $scriptPath

      - name: Remove the WSL2 distribution
        if: always()
        shell: pwsh
        run: |
          wsl --unregister Ubuntu-24.04
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Ubuntu-24.04 was not registered or could not be removed"
          }
          exit 0
